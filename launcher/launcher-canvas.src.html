// ---------- prefs & state ----------
function loadPref(k,d){ try{ var v=localStorage.getItem('hb.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function savePref(k,v){ try{ localStorage.setItem('hb.'+k,JSON.stringify(v)); }catch(e){} }

var apps=['Netflix','YouTube','Prime Video','Plex','TV Browser'];

var tv=null, items=[];
var state={cursor:1, ambient:false, toast:null, toastUntil:0};

// The whole launcher is one list. Headers are landmarks, not stops.
function buildItems(){
  var l=[{kind:'head',label:'Apps'}];
  apps.forEach(function(a){ l.push({kind:'app', name:a, label:a}); });
  l.push({kind:'head',label:'Inputs'});
  sources.forEach(function(s){ l.push({kind:'input', src:s, label:pretty(s.name)}); });
  l.push({kind:'head',label:'Display'});
  SETTINGS.forEach(function(s){ l.push({kind:'set', set:s, label:s.label}); });
  items=l;
  if(items[state.cursor].kind==='head') state.cursor=nextStop(state.cursor,1);
}
function nextStop(i,dir){
  var j=i+dir;
  while(j>=0 && j<items.length && items[j].kind==='head') j+=dir;
  return (j<0||j>=items.length)? i : j;
}
function pretty(name){ return String(name).replace(/^HDMI(\d)$/,'HDMI $1'); }
function isCurrent(src){
  if(!tv || tv.statetype==='app' || tv.statetype==='remote_launcher') return false;
  var sid=String(tv.sourceid||'').toLowerCase().replace(/\s+/g,'');
  return !!sid && (sid===String(src.name).toLowerCase().replace(/\s+/g,'') || sid===String(src.id).toLowerCase());
}
function nowOn(){ for(var i=0;i<sources.length;i++) if(isCurrent(sources[i])) return sources[i]; return null; }
function hueOf(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360; return h; }
function hslRgb(h,s,l){
  s/=100; l/=100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r,gg,b;
  if(h<60){r=c;gg=x;b=0}else if(h<120){r=x;gg=c;b=0}else if(h<180){r=0;gg=c;b=x}else if(h<240){r=0;gg=x;b=c}else if(h<300){r=x;gg=0;b=c}else{r=c;gg=0;b=x}
  return [Math.round((r+m)*255),Math.round((gg+m)*255),Math.round((b+m)*255)];
}
var brandCache={};
function brandOf(name){
  var b=BRANDS[name.toLowerCase()]; if(b) return b;
  if(!brandCache[name]) brandCache[name]={logo:null, hue:hueOf(name), tint:hslRgb(hueOf(name),55,34)};
  return brandCache[name];
}
function tintOf(it){
  if(it.kind==='app') return brandOf(it.name).tint;
  if(it.kind==='input') return it.src.signal||isCurrent(it.src)?[30,110,70] : GREY;
  return GREY;
}
function secondary(it){
  if(it.kind==='input') return isCurrent(it.src)?'On now' : it.src.signal?'Signal detected' : 'No signal';
  if(it.kind==='set') return it.set.value? it.set.value() : it.set.hint;
  return '';
}

function fit(){
  var vw=window.innerWidth, vh=window.innerHeight, dpr=window.devicePixelRatio||1;
  var s=Math.min(vw/W, vh/H), cw=Math.round(W*s), ch=Math.round(H*s);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.style.left=Math.round((vw-cw)/2)+'px'; cv.style.top=Math.round((vh-ch)/2)+'px';
  var q=/[?&]rs=([\d.]+)/.exec(location.search);
  var RS=q?parseFloat(q[1]):(IS_TV?(prefs.sharp?1:0.667):1);
  CSS_S=s; K=s*dpr*RS;
  var pw=Math.round(W*K), ph=Math.round(H*K);
  if(cv.width!==pw||cv.height!==ph){ cv.width=pw; cv.height=ph; }
  HIRES=K>1.15;
  bgDirty=true; invalidate();
}

    var ts=textSprite(c.h+':'+c.m,weight,size,-0.03*size,INK);
    blit(ts,W-EDGE-merW-ts.tw,base);
  } else {
    font(weight,size); g.fillStyle=INK;
    tracked(c.h+':'+c.m,W-EDGE-merW,base,-0.03*size,'right');
  }
  if(c.mer){ font(500,16+6*(1-ui)); g.fillStyle=DIM; g.textAlign='right'; g.fillText(c.mer,W-EDGE,base); g.textAlign='left'; }
  var d=c.d, top=base-size*.74;
  font(400,17); g.fillStyle='rgba(244,241,234,.5)'; g.textAlign='right';
  g.fillText(DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()],W-EDGE,base+32);
  g.textAlign='left';
  g.restore();
}

// Top-right brand mark. Drop your logo at brand/logo.png (or .svg); white on transparent, any size.
var brand={img:null};
function loadBrand(){
  loadImg('brand/logo.png', function(im){ brand.img=im; invalidate(); }, function(){
    loadImg('brand/logo.svg', function(im){ brand.img=im; invalidate(); }, function(){});
  });
}
function drawBrand(now){
  var ui=V('ui'), y=110;
  g.save(); g.globalAlpha*=(.6+.4*(1-ui))*boot(now,700,800);
  if(brand.img){
    var h=30, w=h*brand.img.naturalWidth/brand.img.naturalHeight;
    g.drawImage(brand.img,W-EDGE-w,y-h+4,w,h);
  } else {
    font(600,22); g.fillStyle=INK; g.textAlign='right'; g.fillText('Hisense',W-EDGE,y); g.textAlign='left';
  }
  g.restore();
}
function drawToast(now){
  var a=V('toast'), t=state.toast; if(a<.01||!t) return;
  font(500,15); var vw=g.measureText(t.verb).width; font(600,15); var nw=g.measureText(t.name).width;
  var w=58+vw+nw+24, h=48, x=W/2-w/2, y=44-(1-a)*12;
  g.save(); g.globalAlpha=a;
  rr(g,x,y,w,h,24); g.save(); g.clip();
  if(!prefs.contrast) g.drawImage(blurC,x/W*640,y/H*360,w/W*640,h/H*360,x,y,w,h);
  g.fillStyle='rgba(12,12,14,'+(prefs.contrast?.92:.5)+')'; g.fillRect(x,y,w,h); g.restore();
  g.lineWidth=1; g.strokeStyle='rgba(255,255,255,.18)'; g.stroke();
  var cx=x+28, cy=y+24;
  g.lineWidth=2; g.strokeStyle='rgba(255,255,255,.14)'; g.beginPath(); g.arc(cx,cy,9,0,Math.PI*2); g.stroke();
  if(t.err){
    g.strokeStyle=RED; g.beginPath(); g.arc(cx,cy,9,0,Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(cx,cy-4.5); g.lineTo(cx,cy+1); g.stroke();
    g.fillStyle=RED; g.beginPath(); g.arc(cx,cy+4.5,1.2,0,Math.PI*2); g.fill();
  } else { var rot=now/720*Math.PI*2; g.strokeStyle=INK; g.beginPath(); g.arc(cx,cy,9,rot,rot+Math.PI*.5); g.stroke(); }
  font(500,15); g.fillStyle=INK; g.fillText(t.verb,x+50,y+29);
  font(600,15); g.fillStyle=INK; g.fillText(t.name,x+50+vw,y+29);
  g.restore();
}

// ---------- behaviour ----------
function focus(i){
  if(i<0||i>=items.length||items[i].kind==='head') return;
  if(i!==state.cursor){ state.cursor=i; anim.hero=0; vel.hero=0; anim.heroA=0; }
  invalidate();
}
function move(dir){ focus(nextStop(state.cursor,dir)); }
function step(dir){
  var it=items[state.cursor]; if(it.kind!=='set'||!it.set.value) return;
  var id=it.set.id;
  if(id==='rotate'){ prefs.rotate=(prefs.rotate+dir+ROTATE.length)%ROTATE.length; startRotation(); }
  else prefs[id]=!prefs[id];
  savePref(id,prefs[id]);
  if(id==='sharp') fit(); else invalidate();
}
function activate(){
  var it=items[state.cursor];
  if(it.kind==='app') launchApp(it.name);
  else if(it.kind==='input') switchSource(it.src);
  else if(it.set.id==='ambient') enterAmbient();
  else if(it.set.id==='next'){ nextPhoto(); startRotation(); }
  else step(1);
}
function enterAmbient(){ state.ambient=true; state.toastUntil=0; bgDirty=true; invalidate(); }
function exitAmbient(){ state.ambient=false; bgDirty=true; invalidate(); }

function toast(verb,name,err){ state.toast={verb:verb,name:name,err:!!err}; state.toastUntil=performance.now()+2200; invalidate(); }
function api(path,done){
  var x=new XMLHttpRequest();
  x.open('GET',path,true); x.timeout=15000;
  x.onload=function(){ var r=null; try{ r=JSON.parse(x.responseText); }catch(e){} done(r); };
  x.onerror=x.ontimeout=function(){ done(null); };
  x.send();
}
function launchApp(name){
  toast('Opening ',name);
  api('/api/launch?name='+encodeURIComponent(name), function(r){ if(!r||!r.ok) toast('Could not open ',name,true); });
}
function switchSource(src){
  toast('Switching to ',pretty(src.name));
  api('/api/source?id='+encodeURIComponent(src.id), function(r){ if(!r||!r.ok) toast('Could not switch to ',pretty(src.name),true); else setTimeout(loadState,1500); });
}
function loadState(){ api('/api/state', function(r){ if(r&&r.ok){ tv=r.data; invalidate(); } }); }
function loadLists(){
  loadState();
  api('/api/apps', function(r){ if(r&&r.ok&&r.data&&r.data.length){ apps=r.data; buildItems(); invalidate(); warm(); } });
  api('/api/sources', function(r){ if(r&&r.ok&&r.data&&r.data.length){ sources=r.data; buildItems(); invalidate(); warm(); } });
}

// ---------- input ----------
function keyName(e){
  var k=e.key||'';
  var alias={Left:'ArrowLeft',Right:'ArrowRight',Up:'ArrowUp',Down:'ArrowDown',Select:'Enter',OK:'Enter',Accept:'Enter',GoBack:'Escape',Back:'Escape',BrowserBack:'Escape',Spacebar:' '};
  if(alias[k]) return alias[k];
  switch(e.keyCode||e.which){
    case 37: return 'ArrowLeft'; case 38: return 'ArrowUp'; case 39: return 'ArrowRight'; case 40: return 'ArrowDown';
    case 13: case 23: case 66: return 'Enter';
    case 27: case 8: case 461: case 10009: return 'Escape';
  }
  return k;
}
window.addEventListener('keydown', function(e){
  var k=keyName(e);
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape',' '].indexOf(k)<0) return;
  e.preventDefault();
  if(state.ambient){ exitAmbient(); return; }
  if(k==='ArrowDown') move(1);
  else if(k==='ArrowUp') move(-1);
  else if(k==='ArrowRight') step(1);
  else if(k==='ArrowLeft') step(-1);
  else if(k==='Escape') focus(nextStop(0,1));
  else if(!e.repeat) activate();
}, true);
document.body.setAttribute('tabindex','-1');
document.body.focus();

function toStage(e){ var b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)/CSS_S, y:(e.clientY-b.top)/CSS_S}; }
function findHit(p){
  for(var i=hits.length-1;i>=0;i--){ var h=hits[i]; if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h) return h; }
  return null;
}
cv.addEventListener('mousemove', function(e){
  if(state.ambient) return;
  var h=findHit(toStage(e));
  if(h && h.i!==state.cursor) focus(h.i);
  cv.style.cursor=h?'pointer':'default';
});
cv.addEventListener('click', function(e){
  document.body.focus();
  if(state.ambient){ exitAmbient(); return; }
  var h=findHit(toStage(e));
  if(h){ focus(h.i); activate(); }
});
cv.addEventListener('wheel', function(e){ if(!state.ambient){ e.preventDefault(); move(e.deltaY>0?1:-1); } }, {passive:false});
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit,60); });

var lastMinute=-1;
setInterval(function(){ var m=new Date().getMinutes(); if(m!==lastMinute){ lastMinute=m; invalidate(); } },5000);
function fontsChanged(){ sprites={}; spriteN=0; glyphW={}; glyphN=0; invalidate(); warm(); }
// Draw every row's title and mark ahead of time, one item per idle slot, so the first visit doesn't stall.
var warmTimer, warmAt=0;
function warm(){ clearTimeout(warmTimer); warmAt=0; warmTimer=setTimeout(warmNext,1800); }
function warmNext(){
  while(warmAt<items.length && items[warmAt].kind==='head') warmAt++;
  if(warmAt>=items.length) return;
  var it=items[warmAt], label;
  font(400,38); textSprite(ellipsize(it.label,980),400,38,-0.035*38,INK);
  font(400,116); label=ellipsize(it.label,980); textSprite(label,400,116,-0.035*116,INK);
  font(500,116); label=ellipsize(it.label,980); textSprite(label,500,116,-0.035*116,INK);
  heroSprite(warmAt);
  warmAt++; warmTimer=setTimeout(warmNext,60);
}
if(document.fonts){
  if(document.fonts.ready) document.fonts.ready.then(fontsChanged, function(){});
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', fontsChanged);
}

// ---------- boot ----------
buildItems();
var t0=tintOf(items[state.cursor]); anim.tr=t0[0]; anim.tg=t0[1]; anim.tb=t0[2];
anim.ui=0; anim.cur=state.cursor; anim.hero=1;
fit();
loadLists();
setInterval(loadLists, 60000);
showPhoto(photo.at);
startRotation();
loadBrand();
invalidate();
})();
</script>
</body>
